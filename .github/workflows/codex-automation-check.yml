name: Codex Automation Check

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  check-codex-ready:
    runs-on: ubuntu-latest

    steps:
      - name: Find codex-ready issues
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: "codex-ready",
              per_page: 10
            });

            if (!issues.data.length) {
              core.info("No codex-ready issues found.");
              return;
            }

            for (const issue of issues.data) {
              if (issue.pull_request) continue;

              const comments = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: issue.number,
                per_page: 100
              });

              const alreadyCommented = comments.data.some(comment =>
                comment.body.includes("MEDIVISTA Codex automation prompt")
              );

              if (alreadyCommented) {
                core.info(`Issue #${issue.number} already has automation prompt.`);
                continue;
              }

              const body = `
## MEDIVISTA Codex automation prompt

Use this prompt in Codex:

\`\`\`text
Work on GitHub Issue #${issue.number}.

Repository:
${owner}/${repo}

Base branch:
medivista

Create a new branch:
feature/issue-${issue.number}-codex-task

Read AGENTS.md first.
Follow the Issue requirements exactly.
Do not expand the scope.

Important:
- Main website must remain catalog-only.
- Do not add prices.
- Do not add Add to Cart.
- Do not add Cart page.
- Do not add Checkout.
- Do not add payment.
- Keep frontend copy English-first.
- Avoid risky medical or efficacy claims.
- Brand Shop must link to https://shop.medivista.co.kr.

After implementation:
- Run basic checks.
- Summarize changed files.
- Open a pull request.
- Reference Issue #${issue.number} in the PR description.
\`\`\`
`;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body
              });

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels: ["codex-running"]
              });

              core.info(`Added automation prompt to Issue #${issue.number}`);
            }
